name: Build and publish image

# 为什么要有这个：
# ZimaOS 的「自定义安装」只接受**镜像引用**，不接受 build 上下文 ——
# 所以在 GitHub 上把镜像构建好推到 GHCR，设备侧粘一份引用该镜像的 compose 即可。
# 好处：不用在设备上装构建工具链，也不用手动处理 CPU 架构（这里两种架构都构建）。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR 的镜像名必须全小写
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopify

jobs:
  # 先跑测试：坏掉的代码不该被发布成镜像
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -m pytest -q

      # pnpm 版本读 package.json 里的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frontend logic tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test:logic

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推镜像到 GHCR 需要
    steps:
      - uses: actions/checkout@v4

      # 同时构建 amd64 与 arm64：设备可能是 x86 也可能是 arm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 缓存让后续构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
